<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โยธิน อินทรภิรมย์ — Portfolio</title>
<meta name="description" content="ประวัติและผลงาน Video Editor & Motion Designer">
<meta property="og:title" content="โยธิน อินทรภิรมย์ — Portfolio">
<meta property="og:description" content="ประวัติและผลงาน Video Editor & Motion Designer">
<meta property="og:image" content="img/profile.webp">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#F2AB1D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23F2AB1D'/%3E%3Cpath d='M12.5 9.5l11 6.5-11 6.5z' fill='%233A3A3A'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap">

<style>
/* ===== โทนสีตามไฟล์ ref ===== */
:root{
  --amber:#F2AB1D;
  --amber-soft:#FCEBC6;
  --amber-deep:#D8930C;
  --ink:#3A3A3A;
  --bg:#E1E1E1;
  --surface:#F1F1F1;
  --surface-2:#E7E7E7;
  --muted:#7A7A7A;
  --border:#D2D2D2;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
  --shadow-lift:0 3px 8px rgba(0,0,0,.08),0 20px 46px rgba(0,0,0,.14);
  --r:20px; --maxw:1080px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --amber:#F2AB1D; --amber-soft:#3A2C0E; --amber-deep:#FFC24D;
  --ink:#ECECEC; --bg:#1A1A1A; --surface:#242424; --surface-2:#2E2E2E;
  --muted:#9C9C9C; --border:#343434;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  --shadow-lift:0 3px 8px rgba(0,0,0,.6),0 20px 46px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --amber:#F2AB1D; --amber-soft:#3A2C0E; --amber-deep:#FFC24D;
  --ink:#ECECEC; --bg:#1A1A1A; --surface:#242424; --surface-2:#2E2E2E;
  --muted:#9C9C9C; --border:#343434;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  --shadow-lift:0 3px 8px rgba(0,0,0,.6),0 20px 46px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Prompt",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
  font-weight:400;line-height:1.65;-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:16px}
@media (min-width:768px){.wrap{padding-inline:28px}}

/* ===== หัวเว็บ ===== */
header{padding:40px 0 30px}
@media (min-width:860px){header{padding:70px 0 44px}}
.hero{display:grid;gap:26px;align-items:center}
@media (min-width:860px){.hero{grid-template-columns:1fr auto;gap:48px}}

.quote{
  font-size:56px;line-height:.5;color:var(--amber);
  font-weight:700;letter-spacing:-.04em;margin-bottom:6px;display:block;
}
.eyebrow{
  display:inline-block;background:var(--amber);color:#3A3A3A;
  font-size:13px;font-weight:600;letter-spacing:.01em;
  padding:6px 16px;border-radius:100px;margin-bottom:14px;
}
h1{
  margin:0;font-size:clamp(30px,7vw,52px);font-weight:700;
  letter-spacing:-.03em;line-height:1.1;
}
h1 .dot{color:var(--amber)}
.sub-en{margin:8px 0 0;color:var(--muted);font-size:clamp(14px,2.6vw,17px);font-weight:400}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.links a{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500;
  padding:8px 15px;border-radius:100px;transition:.16s;
}
.links a:hover{background:var(--amber);border-color:var(--amber);color:#3A3A3A}
.links a svg{width:15px;height:15px;flex:0 0 auto;fill:currentColor}
.links a b{font-weight:500}
.links a em{font-style:normal;color:var(--muted);font-size:12.5px}
.links a:hover em{color:#5A4A1A}

/* รูปโปรไฟล์ + บล็อกเหลืองซ้อนหลัง แบบใน ref */
.portrait{position:relative;width:170px;justify-self:start}
@media (min-width:860px){.portrait{width:290px;justify-self:end}}
.portrait::before{
  content:"";position:absolute;inset:16px -16px -16px 16px;
  background:var(--amber);border-radius:var(--r);
}
.portrait img{
  position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 12%;
  border-radius:var(--r);box-shadow:var(--shadow);
}

/* ===== Dropdown ใหญ่ 2 อัน ===== */
.panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:18px;overflow:hidden;
}
.panel>summary{
  list-style:none;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:14px;padding:16px;
}
@media (min-width:768px){.panel>summary{padding:20px 24px;gap:18px}}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary:hover{background:var(--surface-2)}
.pic-ico{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;
  background:var(--amber);display:grid;place-items:center;
}
.pic-ico svg{width:24px;height:24px;fill:#3A3A3A}
.panel>summary h2{margin:0;font-size:clamp(17px,3.4vw,22px);font-weight:600;letter-spacing:-.02em;flex:1}
.count{color:var(--muted);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.chev{width:22px;height:22px;flex:0 0 auto;stroke:var(--muted);stroke-width:2.4;fill:none;transition:transform .25s}
.panel[open]>summary .chev{transform:rotate(180deg)}
.panel[open]>summary{border-bottom:1px solid var(--border)}
.panel-body{padding:6px 16px 26px}
@media (min-width:768px){.panel-body{padding:10px 24px 32px}}

/* ===== ประวัติ ===== */
.bio-grid{display:grid;gap:14px;margin-top:16px}
@media (min-width:720px){.bio-grid{grid-template-columns:1fr 1fr}}
.tile{background:var(--surface-2);border-radius:16px;padding:18px 18px 20px}
.tile h3{
  margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);
  display:inline-block;background:var(--amber);padding:3px 10px;border-radius:7px;
}
.tile ul{margin:0;padding-left:1.1em}
.tile li{margin-bottom:7px;font-size:14.5px}
.tile li::marker{color:var(--amber)}
.tile li:last-child{margin-bottom:0}
/* Education — โลโก้ + ข้อความ */
.edu{display:flex;align-items:center;gap:14px}
.edu img{width:58px;height:58px;flex:0 0 auto;object-fit:contain}
.edu .uni{margin:0 0 2px;font-size:14.5px;font-weight:600;color:var(--amber-deep)}

/* ประวัติการทำงาน */
.career{margin:0;padding:0;list-style:none}
.career li{
  position:relative;padding:9px 0 9px 24px;font-size:14.5px;font-weight:500;
  border-bottom:1px dashed var(--border);
}
.career li:last-child{border-bottom:0}
.career li::before{
  content:"";position:absolute;left:3px;top:17px;width:9px;height:9px;
  border-radius:50%;background:var(--border);
}
.career li.now::before{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.career .role{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:1px}
.career .now-tag{
  display:inline-block;margin-left:8px;vertical-align:1px;
  background:var(--amber);color:#3A3A3A;font-size:11px;font-weight:600;
  padding:1px 8px;border-radius:100px;
}
.tile .degree{margin:0;font-size:16px;font-weight:600}
.tile .major{margin:3px 0 0;color:var(--muted);font-size:14.5px}

.sec-title{
  margin:32px 0 14px;font-size:15.5px;font-weight:600;letter-spacing:-.01em;
  padding-bottom:10px;border-bottom:2px solid var(--amber);
}

/* ===== ผลงาน ===== */
.group{margin-top:28px}
.group:first-child{margin-top:12px}
.group-head{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 12px;
  padding:10px 14px;margin-bottom:4px;border-radius:12px;
  background:var(--surface-2);
}
.group-head strong{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.group-head span{color:var(--muted);font-size:13px}

.work{border-bottom:1px solid var(--border)}
.work:last-child{border-bottom:0}
.work>summary{list-style:none;cursor:pointer;user-select:none;display:flex;align-items:center;gap:12px;padding:15px 4px}
.work>summary::-webkit-details-marker{display:none}
.bar{width:4px;height:17px;flex:0 0 auto;border-radius:3px;background:var(--amber);transition:height .2s}
.work[open]>summary .bar{height:26px}
.work-title{flex:1;font-size:15.5px;font-weight:600;letter-spacing:-.01em;transition:.15s}
.work>summary:hover .work-title{color:var(--amber-deep)}
.badge{
  flex:0 0 auto;font-size:11.5px;font-weight:500;color:var(--ink);
  background:var(--amber-soft);border-radius:100px;padding:3px 10px;font-variant-numeric:tabular-nums;
}
.work .chev{width:18px;height:18px}
.work[open]>summary .chev{transform:rotate(180deg)}
.work-body{padding:0 4px 26px 20px}
.desc{margin:0 0 18px;color:var(--muted);font-size:14.5px;max-width:74ch}
.desc + .blist{margin-top:-8px}
.blist{margin:0 0 18px;padding-left:1.1em;color:var(--muted);font-size:14.5px;max-width:74ch}
.blist li{margin-bottom:8px}
.blist li::marker{color:var(--amber)}

/* ===== วิดีโอ ===== */
.vids{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:640px){.vids{grid-template-columns:repeat(2,1fr)}}
.vids.one{grid-template-columns:1fr;max-width:660px}
.vids.tall{grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:640px){.vids.tall{grid-template-columns:repeat(4,1fr);gap:16px}}
.vids.tall.one{max-width:250px}
.vid{border:0;padding:0;background:transparent;text-align:left;cursor:pointer;display:block}
.thumb{
  position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:var(--surface-2);box-shadow:var(--shadow);
  transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s;
}
.vid:hover .thumb,.vid:focus-visible .thumb{transform:translateY(-4px);box-shadow:var(--shadow-lift)}
.vid:focus-visible{outline:none}
.vid:focus-visible .thumb{outline:3px solid var(--amber);outline-offset:3px}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.vid:hover .thumb img{transform:scale(1.05)}
.thumb.blank{background:linear-gradient(140deg,#4A4A4A,#2C2C2C 60%,#3F3A2C)}
.thumb.blank::after{
  content:attr(data-t);position:absolute;left:12px;right:12px;bottom:11px;
  color:rgba(255,255,255,.85);font-size:12px;font-weight:500;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.play{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(to top,rgba(0,0,0,.4),rgba(0,0,0,0) 58%);transition:.25s}
.vid:hover .play{background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,.06) 62%)}
.play i{
  width:52px;height:52px;border-radius:50%;background:var(--amber);
  display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.35);
  transition:transform .25s cubic-bezier(.2,.7,.3,1);
}
.vid:hover .play i{transform:scale(1.12)}
.play svg{width:19px;height:19px;margin-left:3px;fill:#3A3A3A}
.vid-label{
  margin:9px 2px 0;font-size:13.5px;font-weight:500;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* หัวข้อย่อยในผลงาน เช่น Long form / Short form */
.sub-label{
  margin:22px 0 12px;font-size:13px;font-weight:600;letter-spacing:.02em;
  display:inline-block;background:var(--amber);color:#3A3A3A;padding:3px 12px;border-radius:7px;
}
.sub-label:first-child{margin-top:0}

/* ===== แกลเลอรีภาพ ===== */
.gal{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:18px}
@media (min-width:640px){.gal{grid-template-columns:repeat(3,1fr);gap:12px}}
.gal button{border:0;padding:0;cursor:pointer;background:var(--surface-2);
  aspect-ratio:4/3;border-radius:12px;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s,opacity .2s}
.gal button:hover img{transform:scale(1.06);opacity:.93}
.gal button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.todo{margin:0;padding:14px 16px;border-radius:12px;background:var(--amber-soft);
  color:var(--ink);font-size:13.5px;font-weight:500}

/* ===== lightbox ===== */
dialog{padding:0;border:0;width:100%;height:100%;max-width:100vw;max-height:100vh;background:transparent;overflow:hidden}
dialog::backdrop{background:rgba(20,20,20,.94);backdrop-filter:blur(6px)}
.lb{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px}
.frame{width:100%;max-width:min(1400px,calc((100vh - 130px) * 16 / 9));aspect-ratio:16/9;
  background:#000;border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.frame iframe,.frame img{width:100%;height:100%;border:0;display:block}
.frame.pic{aspect-ratio:auto;max-height:calc(100vh - 130px);width:auto;max-width:96vw;background:transparent;box-shadow:none}
.frame.pic img{width:auto;height:auto;max-width:96vw;max-height:calc(100vh - 130px);object-fit:contain;border-radius:10px}
.lb-meta{text-align:center;color:#EDEDED;max-width:70ch}
.lb-meta strong{display:block;font-size:15.5px;font-weight:600}
.close{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;
  border:0;cursor:pointer;background:var(--amber);color:#3A3A3A;display:grid;place-items:center;transition:.15s;z-index:2}
.close:hover{transform:scale(1.08)}
.close svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.6;fill:none}

footer{border-top:1px solid var(--border);margin-top:48px;padding:26px 0 56px;color:var(--muted);font-size:13px;
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
footer .dot{color:var(--amber);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="hero">
      <div>
        <span class="quote">&rdquo;</span>
        <span class="eyebrow" id="eyebrow"></span>
        <h1 id="h1"></h1>
        <p class="sub-en" id="subEn"></p>
        <nav class="links" id="links"></nav>
      </div>
      <div class="portrait" id="portrait" hidden><img id="photo" alt="" width="290" height="362"></div>
    </div>
  </header>

  <details class="panel" id="panelProfile" open>
    <summary>
      <span class="pic-ico"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/></svg></span>
      <h2>ประวัติส่วนตัว</h2>
      <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </summary>
    <div class="panel-body" id="bodyProfile"></div>
  </details>

  <details class="panel" id="panelWorks">
    <summary>
      <span class="pic-ico"><svg viewBox="0 0 24 24"><path d="M4 4h11a2 2 0 012 2v2.6l4-2.4v11.6l-4-2.4V18a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg></span>
      <h2>ผลงานบางส่วน</h2>
      <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </summary>
    <div class="panel-body" id="bodyWorks"></div>
  </details>

  <footer id="foot"></footer>
</div>

<dialog id="lb" aria-label="ตัวแสดงสื่อ">
  <button class="close" id="closeBtn" aria-label="ปิด">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
  </button>
  <div class="lb">
    <div class="frame" id="frame"></div>
    <div class="lb-meta" id="lbMeta"></div>
  </div>
</dialog>

<script src="data.js?v=6ab3e6c7"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------- หัวเว็บ ---------- */
document.title = SITE.name + " — Portfolio";
$("#eyebrow").textContent = SITE.role;
$("#h1").innerHTML = esc(SITE.name) + (SITE.nickname ? " (" + esc(SITE.nickname) + ")" : "") +
  '<span class="dot">.</span>';
$("#subEn").textContent = SITE.nameEn;
if (SITE.photo) { $("#photo").src = SITE.photo; $("#portrait").hidden = false; }
const ICON = {
  mail:"M2 5a2 2 0 012-2h16a2 2 0 012 2v14a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm2.4.5L12 11l7.6-5.5H4.4z",
  phone:"M6.6 2h3.2l1.6 4-2.1 1.4a12 12 0 005.3 5.3L16 10.6l4 1.6v3.2A2.6 2.6 0 0117.4 18 15.4 15.4 0 012 2.6 2.6 2.6 0 014.6 0z",
  line:"M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.2 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.2.9c0 .3-.2 1 .9.6 1.1-.5 6-3.5 8.1-6C21.3 14.3 22 12.7 22 11c0-4.4-4.5-8-10-8z",
  instagram:"M12 2.2c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.9c-.1 3.2-1.6 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1s-3.6 0-4.9-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.1 15.6 2.1 15.2 2.1 12s0-3.6.1-4.9C2.3 3.9 3.8 2.4 7.1 2.3 8.4 2.2 8.8 2.2 12 2.2zm0 3.1a6.7 6.7 0 100 13.4 6.7 6.7 0 000-13.4zm0 11a4.3 4.3 0 110-8.6 4.3 4.3 0 010 8.6zm6.9-11.3a1.6 1.6 0 11-3.1 0 1.6 1.6 0 013.1 0z",
  facebook:"M22 12a10 10 0 10-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0022 12z",
  link:"M10.6 13.4a4 4 0 005.7 0l3-3a4 4 0 10-5.7-5.7l-1.3 1.3 1.4 1.4 1.3-1.3a2 2 0 112.9 2.9l-3 3a2 2 0 01-2.9 0l-1.4 1.4zm2.8-2.8a4 4 0 00-5.7 0l-3 3a4 4 0 105.7 5.7l1.3-1.3-1.4-1.4-1.3 1.3a2 2 0 11-2.9-2.9l3-3a2 2 0 012.9 0l1.4-1.4z",
};
const contacts = SITE.contacts || [];
$("#links").innerHTML = contacts.map((c) => {
  const d = ICON[c.icon] || ICON.link;
  return `<a href="${esc(c.url)}"${/^https?:/.test(c.url) ? ' target="_blank" rel="noopener"' : ""}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>
      <b>${esc(c.value)}</b><em>${esc(c.type)}</em></a>`;
}).join("");
$("#foot").innerHTML = `<span>© ${new Date().getFullYear()} ${esc(SITE.name)}</span>
  <span class="dot">•</span><span>${esc(SITE.role)}</span>`;

/* ---------- สื่อ ---------- */
const embedSrc = (v) => v.type === "youtube"
  ? `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`
  : `https://drive.google.com/file/d/${v.id}/preview`;

const MEDIA = [];

// YouTube: ดึงภาพปกจาก i.ytimg.com ให้เอง / Drive: ใช้ภาพปกที่แกะมาจากสไลด์
const posterOf = (v) => v.poster
  || (v.type === "youtube" ? `https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg` : "");

function videoHTML(v, fallbackTitle) {
  const name = v.label || fallbackTitle;
  const i = MEDIA.push({ kind: "video", v, title: name }) - 1;
  const ar = v.ar || 16 / 9;
  const poster = posterOf(v);
  return `
    <button class="vid" data-m="${i}" aria-label="เล่น ${esc(name)}">
      <div class="thumb${poster ? "" : " blank"}" style="aspect-ratio:${ar}"
           ${(!poster && !v.label) ? `data-t="${esc(name)}"` : ""}>
        ${poster ? `<img src="${esc(poster)}" alt="" loading="lazy" decoding="async"
             data-yt="${v.type === "youtube" ? esc(v.id) : ""}">` : ""}
        <span class="play"><i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></i></span>
      </div>
      ${v.label ? `<p class="vid-label">${esc(v.label)}</p>` : ""}
    </button>`;
}

function galleryHTML(images, title) {
  if (!images || !images.length) return "";
  return `<div class="gal">` + images.map((src) => {
    const i = MEDIA.push({ kind: "image", src, title }) - 1;
    return `<button data-m="${i}" aria-label="ดูภาพ ${esc(title)}">
        <img src="${esc(src)}" alt="" loading="lazy" decoding="async"></button>`;
  }).join("") + `</div>`;
}

function vidGrid(list, title) {
  if (!list || !list.length) return "";
  const tall = list.every((v) => (v.ar || 1.78) < 1);
  return `<div class="vids${tall ? " tall" : ""}${list.length === 1 ? " one" : ""}">`
       + list.map((v) => videoHTML(v, title)).join("") + `</div>`;
}

function mediaBlock(work) {
  let out = "";
  (work.sections || []).forEach((sec) => {
    out += `<p class="sub-label">${esc(sec.label)}</p>` + vidGrid(sec.videos, work.title);
  });
  out += vidGrid(work.videos, work.title);
  out += galleryHTML(work.images, work.title);
  if (!out) out = `<p class="todo">ยังไม่ได้ใส่วิดีโอ/ภาพของหัวข้อนี้</p>`;
  return out;
}

/* ---------- ผลงาน ---------- */
$("#bodyWorks").innerHTML = GROUPS.map((g) => `
  <section class="group">
    <div class="group-head">
      <strong>${esc(g.org)}</strong>
      ${g.role ? `<span>${esc(g.role)}</span>` : ""}
      ${g.period ? `<span>· ${esc(g.period)}</span>` : ""}
    </div>
    ${g.works.map((w) => {
      const nv = (w.videos || []).length
               + (w.sections || []).reduce((a, s2) => a + s2.videos.length, 0);
      const ni = (w.images || []).length;
      const badge = [nv ? nv + " วิดีโอ" : "", ni ? ni + " ภาพ" : ""].filter(Boolean).join(" · ");
      return `
      <details class="work">
        <summary>
          <span class="bar"></span>
          <span class="work-title">${esc(w.title)}</span>
          ${badge ? `<span class="badge">${esc(badge)}</span>` : ""}
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="work-body">
          ${w.desc ? `<p class="desc">${esc(w.desc)}</p>` : ""}
          ${w.bullets ? `<ul class="blist">${w.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
          ${mediaBlock(w)}
        </div>
      </details>`;
    }).join("")}
  </section>`).join("");

/* ---------- ภาพปก YouTube: maxresdefault ไม่มีทุกคลิป ถอยไป hqdefault ---------- */
document.querySelectorAll(".thumb img[data-yt]").forEach((img) => {
  if (!img.dataset.yt) return;
  img.onerror = function () {
    this.onerror = () => { this.closest(".thumb").classList.add("blank"); this.remove(); };
    this.src = `https://i.ytimg.com/vi/${this.dataset.yt}/hqdefault.jpg`;
  };
});

/* ---------- lightbox ---------- */
const dlg = $("#lb"), frame = $("#frame"), lbMeta = $("#lbMeta");
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-m]");
  if (!btn) return;
  const m = MEDIA[+btn.dataset.m];
  if (m.kind === "video") {
    const ar = m.v.ar || 16 / 9;
    frame.className = "frame";
    frame.style.aspectRatio = String(ar);
    frame.style.maxWidth = `min(1400px, calc((100vh - 130px) * ${ar}))`;
    frame.innerHTML = `<iframe src="${esc(embedSrc(m.v))}"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"
        title="${esc(m.title)}"></iframe>`;
  } else {
    frame.className = "frame pic";
    frame.style.aspectRatio = ""; frame.style.maxWidth = "";
    frame.innerHTML = `<img src="${esc(m.src)}" alt="${esc(m.title)}">`;
  }
  lbMeta.innerHTML = `<strong>${esc(m.title)}</strong>`;
  dlg.showModal();
});
$("#closeBtn").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => {
  if (e.target === dlg || e.target.classList.contains("lb")) dlg.close();
});
dlg.addEventListener("close", () => { frame.innerHTML = ""; });
</script>
